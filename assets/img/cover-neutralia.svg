<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bookShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe847"/>
      <stop offset="100%" stop-color="#d4ce3a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="20" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background nero (vuoto attorno) -->
  <rect width="800" height="1200" fill="#0a0a0a"/>

  <!-- Libro -->
  <g filter="url(#dropShadow)">
    <!-- Dorso laterale per effetto 3D -->
    <polygon points="710,40 760,80 760,1160 710,1140" fill="#b5af2a"/>

    <!-- Front cover -->
    <rect x="80" y="40" width="630" height="1120" fill="url(#bookShadow)"/>

    <!-- Border interno sottile -->
    <rect x="100" y="60" width="590" height="1080" fill="none" stroke="#0a0a0a" stroke-width="2" opacity="0.15"/>

    <!-- Titolo principale -->
    <text x="395" y="380" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="900" fill="#0a0a0a" text-anchor="middle" letter-spacing="4">NEUTRALIA</text>

    <!-- Linea decorativa -->
    <line x1="240" y1="430" x2="550" y2="430" stroke="#0a0a0a" stroke-width="2"/>

    <!-- Sottotitolo riga 1 -->
    <text x="395" y="490" font-family="'EB Garamond', Georgia, serif" font-size="32" font-style="italic" fill="#0a0a0a" text-anchor="middle">Manifesto per il recupero</text>
    <text x="395" y="530" font-family="'EB Garamond', Georgia, serif" font-size="32" font-style="italic" fill="#0a0a0a" text-anchor="middle">della sovranità italiana</text>

    <!-- Logo Edizioni Rosi: ottagono con rosa stilizzata -->
    <g transform="translate(395, 920)">
      <polygon points="-50,-20 -20,-50 20,-50 50,-20 50,20 20,50 -20,50 -50,20" fill="none" stroke="#0a0a0a" stroke-width="2"/>
      <!-- Rosa semplificata: cerchio centrale + petali -->
      <circle cx="0" cy="0" r="12" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
      <circle cx="0" cy="-8" r="6" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
      <circle cx="-7" cy="4" r="6" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
      <circle cx="7" cy="4" r="6" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- Stelo -->
      <line x1="0" y1="20" x2="0" y2="38" stroke="#0a0a0a" stroke-width="1.5"/>
      <path d="M 0 32 Q 8 28 12 34" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
    </g>

    <!-- Etichetta editore -->
    <text x="395" y="1030" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0a0a0a" text-anchor="middle" letter-spacing="4">EDIZIONI ROSI</text>
  </g>
</svg>
